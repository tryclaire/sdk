name: Publish SDK

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package.json version to publish
        required: true
        type: string
      dry_run:
        description: Verify the release without publishing
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: sdk-npm-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@12.1.0 --ignore-scripts
      - name: Verify requested version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: node --input-type=module -e 'import { readFileSync } from "node:fs"; const pkg = JSON.parse(readFileSync("package.json", "utf8")); if (pkg.version !== process.env.RELEASE_VERSION) throw new Error("Requested version does not match package.json");'
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Preview package
        if: inputs.dry_run
        run: npm publish --dry-run --access public --ignore-scripts
      - name: Publish to npm
        if: '!inputs.dry_run'
        run: npm publish --access public --provenance --ignore-scripts
